<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>eventnametag · R1 (상단 다크바)</title>
<style>
  /* ─── BI 토큰 (generate.py가 yaml에서 읽어 inject) ─── */
  :root {
    --brand-dark: {{BRAND_DARK}};
    --brand-light: {{BRAND_LIGHT}};
    --brand-accent-1: {{BRAND_ACCENT_1}};
    --brand-accent-2: {{BRAND_ACCENT_2}};
    --brand-surface-subtle: {{BRAND_SURFACE_SUBTLE}};
    --brand-font-body: {{BRAND_FONT_BODY}};
    --brand-font-mono: {{BRAND_FONT_MONO}};
    --signature-inner: {{SIGNATURE_INNER}};
    --signature-outer: {{SIGNATURE_OUTER}};
  }

  @page {
    size: A4;
    margin: 0;
  }

  * {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    color-adjust: exact;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: white;
    font-family: var(--brand-font-body);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* A4 시트 = 1페이지. 탐사 A4 8칸 라벨지: 2열 × 4행 = 8칸
     여백: 상 13mm / 하 14mm / 좌·우 5mm (실물 프린터 보정 +3mm down)
     칸 간격 수평 2mm, 수직 0 */
  .a4-sheet {
    width: 210mm;
    height: 297mm;
    box-sizing: border-box;
    padding: 13mm 5mm 14mm;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(4, 1fr);
    column-gap: 2mm;
    row-gap: 0;
    page-break-after: always;
    background: white;
  }
  .a4-sheet:last-child {
    page-break-after: auto;
  }

  .cell {
    width: 99mm;
    height: 67.5mm;
    box-sizing: border-box;
    padding: 2mm;
    overflow: hidden;
  }
  .cell.empty {
    /* 빈 칸: 라벨지 재사용을 위해 아무것도 출력하지 않음 */
  }

  .tag {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--brand-light);
    color: var(--brand-dark);
    overflow: hidden;
    position: relative;
  }

  /* ─── R1 시그니처: 상단 슬림 다크바 ───
     min 10mm, 긴 행사명이 두 줄로 감기면 자동 확장 */
  .topbar {
    min-height: 10mm;
    box-sizing: border-box;
    padding: 1mm 5mm;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 3mm;
    color: var(--brand-light);
    background: var(--brand-dark);
    flex-shrink: 0;
  }

  .brand-wrap {
    display: flex;
    align-items: center;
    gap: 2.2mm;
    font-size: 4mm;
    font-weight: 600;
    letter-spacing: -0.005em;
    flex-shrink: 0;
    white-space: nowrap;
  }

  /* ─── 시그니처 마크 ───
     yaml signature.type에 따라 generate.py가 cell에 inject 또는 omit.
     gradient_orb면 inline + 이 클래스 사용. icon_url이면 <img>로 대체. none이면 X. */
  .signature-orb {
    width: 3.5mm;
    height: 3.5mm;
    border-radius: 50%;
    flex-shrink: 0;
    background: radial-gradient(circle at 50% 25%,
      var(--signature-inner) 0%,
      var(--signature-inner) 30%,
      var(--signature-outer) 80%,
      var(--signature-outer) 100%);
  }

  .event {
    font-size: 3mm;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--brand-accent-2);
    font-family: var(--brand-font-mono);
    text-align: right;
    line-height: 1.25;
  }

  /* ─── 본문 — 중앙 정렬 ─── */
  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 5mm 5mm 4mm;
  }

  .name {
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.015em;
    /* font-size는 generate.py가 이름 길이에 따라 inline으로 주입 (기본 14mm) */
  }

  .company {
    font-weight: 600;
    color: var(--brand-dark);
    margin-top: 3mm;
    line-height: 1.15;
    /* font-size는 generate.py가 회사명 길이에 따라 inline으로 주입 (기본 5.5mm) */
  }

  .role {
    font-size: 3.2mm;
    color: #52525b;            /* 본문 secondary — BI 무관 회색 */
    font-family: var(--brand-font-mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 1.2mm;
  }

  .intro {
    font-size: 3.2mm;
    color: #71717a;            /* 본문 tertiary — BI 무관 회색 */
    font-style: italic;
    margin-top: 3mm;
    padding-top: 2mm;
    border-top: 0.3mm dashed var(--brand-accent-1);
    max-width: 85%;
  }

  /* ─── Blank 모드 (현장 수기용) ─── */
  .body.blank-body {
    justify-content: center;
    gap: 6mm;
    padding: 6mm 8mm;
  }
  .blank-line {
    width: 100%;
    border-bottom: 0;
    height: 11mm;
  }
  .blank-line.info-line {
    height: 7mm;
  }
  .blank-label {
    font-family: var(--brand-font-mono);
    font-size: 2mm;
    color: #a1a1aa;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: -5mm;
    text-align: center;
  }

  /* 화면 미리보기 — 인쇄 시 영향 없음 */
  @media screen {
    body {
      background: #333;
      padding: 20px 0;
    }
    .a4-sheet {
      margin: 0 auto 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
  }

  @media print {
    body {
      background: white;
      padding: 0;
    }
    .a4-sheet {
      margin: 0;
      box-shadow: none;
    }
  }
</style>
</head>
<body>

</body>
</html>
