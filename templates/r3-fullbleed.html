<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>eventnametag · R3 (풀블리드 다크)</title>
<style>
  /* ─── BI 토큰 (generate.py가 yaml에서 읽어 inject) ─── */
  :root {
    --brand-dark: {{BRAND_DARK}};
    --brand-light: {{BRAND_LIGHT}};
    --brand-accent-1: {{BRAND_ACCENT_1}};
    --brand-accent-2: {{BRAND_ACCENT_2}};
    --brand-surface-subtle: {{BRAND_SURFACE_SUBTLE}};
    --brand-font-body: {{BRAND_FONT_BODY}};
    --brand-font-mono: {{BRAND_FONT_MONO}};
    --signature-inner: {{SIGNATURE_INNER}};
    --signature-outer: {{SIGNATURE_OUTER}};
  }

  /* ─── 잉크 커버리지 권장: 35% 이하 ───
     R3는 셀 전체가 다크 배경이라 잉크 사용량이 가장 많은 skeleton이다.
     - 인쇄 매수 N장 × 셀 8칸 × ~67cm² × dark 비율 ≈ 잉크 부담
     - 100매 미만 + 잉크젯 신품 카트리지가 아니면 R1·R4를 권장
     - generate.py 가드레일 G3 (--ignore-ink로 강행 가능)이 raster 분석으로 경고. */

  @page {
    size: A4;
    margin: 0;
  }

  * {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    color-adjust: exact;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: white;
    font-family: var(--brand-font-body);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* A4 시트 = 1페이지. 탐사 A4 8칸 라벨지: 2열 × 4행 = 8칸
     여백·간격 R1과 동일. */
  .a4-sheet {
    width: 210mm;
    height: 297mm;
    box-sizing: border-box;
    padding: 13mm 5mm 14mm;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(4, 1fr);
    column-gap: 2mm;
    row-gap: 0;
    page-break-after: always;
    background: white;
  }
  .a4-sheet:last-child {
    page-break-after: auto;
  }

  .cell {
    width: 99mm;
    height: 67.5mm;
    box-sizing: border-box;
    padding: 2mm;
    overflow: hidden;
  }
  .cell.empty {
    /* 빈 칸 출력 X */
  }

  /* ─── R3: 풀블리드 다크 ───
     셀 전체 = primary_dark 배경. 텍스트 = primary_light.
     accent 색은 라디얼 메쉬 그라디언트로 코너에 배치 (잉크 35% 이하 유지). */
  .tag {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--brand-dark);
    color: var(--brand-light);
    overflow: hidden;
    position: relative;
    /* 메쉬 그라디언트 — accent 색을 코너에 살짝 (alpha 25% → 잉크 부담 감소) */
    background-image:
      radial-gradient(circle at 0% 0%,
        color-mix(in srgb, var(--brand-accent-1) 22%, transparent) 0%,
        transparent 38%),
      radial-gradient(circle at 100% 100%,
        color-mix(in srgb, var(--brand-accent-2) 18%, transparent) 0%,
        transparent 42%);
    background-color: var(--brand-dark);
  }

  /* 상단 워드마크 영역 — R1 .topbar 마크업 그대로지만 배경 투명 */
  .topbar {
    box-sizing: border-box;
    padding: 5mm 6mm 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 3mm;
    color: var(--brand-light);
    background: transparent;
    flex-shrink: 0;
  }

  .brand-wrap {
    display: flex;
    align-items: center;
    gap: 2.2mm;
    font-size: 4mm;
    font-weight: 600;
    letter-spacing: -0.005em;
    flex-shrink: 0;
    white-space: nowrap;
    color: var(--brand-light);
  }

  .signature-orb {
    width: 3.5mm;
    height: 3.5mm;
    border-radius: 50%;
    flex-shrink: 0;
    background: radial-gradient(circle at 50% 25%,
      var(--signature-inner) 0%,
      var(--signature-inner) 30%,
      var(--signature-outer) 80%,
      var(--signature-outer) 100%);
  }

  .event {
    font-size: 3mm;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--brand-accent-2);
    font-family: var(--brand-font-mono);
    text-align: right;
    line-height: 1.25;
  }

  /* 본문 — 풀블리드 컨텍스트라 텍스트 전부 light. */
  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 4mm 6mm 5mm;
    z-index: 1;
  }

  .name {
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.015em;
    color: var(--brand-light);
    /* font-size는 generate.py가 inline 주입 */
  }

  .company {
    font-weight: 600;
    color: var(--brand-light);
    opacity: 0.92;
    margin-top: 3mm;
    line-height: 1.15;
  }

  .role {
    font-size: 3.2mm;
    color: var(--brand-accent-1);
    font-family: var(--brand-font-mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 1.2mm;
  }

  .intro {
    font-size: 3.2mm;
    color: var(--brand-light);
    opacity: 0.78;
    font-style: italic;
    margin-top: 3mm;
    padding-top: 2mm;
    border-top: 0.3mm dashed var(--brand-accent-1);
    max-width: 85%;
  }

  /* Blank 모드 — 풀블리드 다크 (build_blank_cell이 빈 .body.blank-body 생성) */
  .body.blank-body {
    justify-content: center;
    gap: 6mm;
    padding: 6mm 8mm;
  }

  @media screen {
    body {
      background: #333;
      padding: 20px 0;
    }
    .a4-sheet {
      margin: 0 auto 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
  }

  @media print {
    body {
      background: white;
      padding: 0;
    }
    .a4-sheet {
      margin: 0;
      box-shadow: none;
    }
  }
</style>
</head>
