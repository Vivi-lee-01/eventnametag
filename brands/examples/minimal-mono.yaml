schema_version: "1"

# ─── 메타 ───
# 모노톤(회색 계열) 미니멀 BI. 잉크 사용량 가장 적음. 고급감.
name: "Minimal Mono"
slug: "minimal-mono"

# ─── 컬러 토큰 ───
colors:
  primary_dark: "#171717"        # 거의 검정
  primary_light: "#fafafa"       # 거의 흰색
  accent_1: "#71717a"            # 미드 회색
  accent_2: "#a1a1aa"            # 라이트 회색
  surface_subtle: "#e4e4e7"      # 매우 라이트 보더

# ─── 타이포 ───
# (생략하면 system-ui sans + monospace mono fallback)

# ─── 워드마크 ───
wordmark:
  text: "Minimal Mono"
  case: "upper"                  # 모노톤은 올캡스가 더 어울림

# ─── 시그니처 (없음) ───
signature:
  type: "none"

# ─── Skeleton 매칭 ───
# R1·R4가 모노톤과 가장 어울림
preferred_skeletons: [r1, r4]

# ─── 인쇄 옵션 ───
print:
  ink_coverage_warning: 15
