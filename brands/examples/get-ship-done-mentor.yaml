schema_version: "1"

# ─── 메타 ───
# Get Ship Done 강사/멘토(MENTOR)용 — v0.6 풀셀 AI 디자인. 블루 계열 + 로켓 + 지팡이.
name: "Get Ship Done"
slug: "get-ship-done-mentor"

# ─── 컬러 토큰 (강사=블루 계열) ───
colors:
  primary_dark: "#0B1220"        # 근검정 네이비 (이름 텍스트 — 최대 가독)
  primary_light: "#FFFFFF"
  accent_1: "#1E3A8A"            # 네이비 블루 (상단 밴드)
  accent_2: "#60A5FA"            # 라이트 블루 (장식 플로리시)
  surface_subtle: "#1E293B"

# ─── 타이포 ───
fonts:
  body:
    family: "Pretendard"
    fallback: "system-ui, -apple-system, Inter, sans-serif"
  mono:
    family: "SF Mono"
    fallback: "ui-monospace, Menlo, monospace"

# ─── 워드마크 ───
wordmark:
  text: "Get Ship Done"
  case: "title"

# ─── 시그니처 (v0.6 풀셀에선 미사용 — 장식은 cell_template에) ───
signature:
  type: "none"

# ─── v0.6 AI 셀 템플릿 (해커톤 무드: 다이애고널 밴드 + 로켓 + 분사 + 지팡이) ───
design:
  cell_template: |
    <!-- textzone: 0.03,0.35,0.97,0.99 -->
    <div class="gsd" style="position:absolute;inset:0;background:var(--brand-light);font-family:var(--brand-font-body);overflow:hidden">
      <div style="position:absolute;top:0;left:0;right:0;height:33%;background:var(--brand-accent-1);clip-path:polygon(0 0,100% 0,100% 78%,0 100%)">
        <svg viewBox="0 0 100 40" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;color:var(--brand-light);opacity:0.13">
          <circle cx="6" cy="7" r="1.1" fill="currentColor"/><circle cx="13" cy="7" r="1.1" fill="currentColor"/><circle cx="6" cy="14" r="1.1" fill="currentColor"/><circle cx="20" cy="10" r="1.1" fill="currentColor"/><circle cx="27" cy="6" r="1.1" fill="currentColor"/><circle cx="34" cy="13" r="1.1" fill="currentColor"/><circle cx="13" cy="21" r="1.1" fill="currentColor"/><circle cx="41" cy="8" r="1.1" fill="currentColor"/>
        </svg>
        <svg viewBox="0 0 64 64" style="position:absolute;right:4.5mm;top:1mm;width:18mm;height:18mm;color:var(--brand-light)">
          <path d="M32 5c6 0 11 9 11 24v12H21V29C21 14 26 5 32 5Z" fill="currentColor"/>
          <circle cx="32" cy="23" r="4.5" fill="var(--brand-accent-1)"/>
          <path d="M21 34 12 50l9-5z" fill="currentColor"/>
          <path d="M43 34l9 16-9-5z" fill="currentColor"/>
          <path d="M26 41h12l-6 16z" fill="currentColor" opacity="0.9"/>
          <circle cx="28" cy="58" r="1.3" fill="currentColor" opacity="0.6"/>
          <circle cx="36" cy="60" r="1.1" fill="currentColor" opacity="0.5"/>
        </svg>
        <svg viewBox="0 0 24 24" style="position:absolute;left:5.5mm;top:3.4mm;width:4.6mm;height:4.6mm;color:var(--brand-light)">
          <path d="M14.5 6.5L4 17l2.5 2.5L17 9z" fill="currentColor"/><path d="M17 3l1 2.4L20.5 6.5 18 7.6 17 10l-1-2.4L13.5 6.5 16 5.4z" fill="currentColor"/><circle cx="20" cy="13" r="1.1" fill="currentColor"/>
        </svg>
        <div style="position:absolute;left:11mm;top:3mm;color:var(--brand-light);font:800 6mm var(--brand-font-body);letter-spacing:-0.02em">{{organizer}}</div>
        <div style="position:absolute;left:5.5mm;top:14.5mm;width:68mm;color:var(--brand-light);font:italic 600 3.2mm var(--brand-font-body);line-height:1.25;opacity:0.94;transform:rotate(-3deg);transform-origin:left center">Let's ship ideas, grow together, achieve more!</div>
      </div>
      <div style="position:absolute;left:6mm;right:6mm;top:37%;bottom:6mm;display:flex;flex-direction:column;justify-content:center">
        <div style="font-weight:800;font-size:{{name_size}};color:var(--brand-dark);line-height:1.06;letter-spacing:-0.02em">{{name}}</div>
        <div style="font-weight:600;font-size:{{company_size}};color:var(--brand-dark);margin-top:3mm;opacity:0.82">{{company}}</div>
        <div style="font:700 3mm var(--brand-font-mono);color:var(--brand-accent-1);letter-spacing:0.12em;margin-top:2.4mm;text-transform:uppercase">{{role}}</div>
      </div>
    </div>

# ─── Skeleton floor (게이트 실패 시 fallback) ───
preferred_skeletons: [r1]

# ─── 인쇄 옵션 ───
print:
  ink_coverage_warning: 32
